<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Galgame 虚拟伙伴</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="scene">

    <div id="background"></div>

    <div id="sprite-area">
      <div id="sprite-container">
        <div id="vrm-container"></div>
      </div>
      <div id="sprite-single">
        <img id="sprite-face-a" class="sprite-face" src="" />
        <img id="sprite-face-b" class="sprite-face hidden" src="" />
      </div>
    </div>

    <div id="ui-layer">
      <div id="dialog-box">
        <div id="name-tag"><span id="character-name"></span></div>
        <p id="dialog-text"></p>
        <button id="replay-btn" onclick="replayLastResponse()" title="重播" aria-label="重播上一条回复">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
        <button id="favorite-btn" title="收藏语音" aria-label="收藏语音" onclick="toggleFavorite()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>
      </div>

      <div id="input-row">
        <button id="mic-btn" title="语音输入" aria-label="语音输入">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
          </svg>
        </button>
        <textarea id="user-input" placeholder="请输入你的回应…" title="Enter 发送 / Shift+Enter 换行" autocomplete="off" maxlength="20000" rows="1"></textarea>
        <button id="expand-btn" title="展开输入框" aria-label="展开输入框">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
        <button id="send-btn" title="发送" aria-label="发送">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <button id="history-btn" title="对话历史" aria-label="对话历史" onclick="toggleHistory()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8v4l3 3"></path>
      <circle cx="12" cy="12" r="10"></circle>
    </svg>
  </button>

  <button id="session-btn" title="会话切换" aria-label="会话切换" onclick="toggleSessionPanel()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"></line>
      <line x1="8" y1="12" x2="21" y2="12"></line>
      <line x1="8" y1="18" x2="21" y2="18"></line>
      <line x1="3" y1="6" x2="3.01" y2="6"></line>
      <line x1="3" y1="12" x2="3.01" y2="12"></line>
      <line x1="3" y1="18" x2="3.01" y2="18"></line>
    </svg>
  </button>

  <div id="history-panel">
    <div id="history-overlay" onclick="toggleHistory()"></div>
    <div id="history-content" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <div id="history-header">
        <span id="history-title">对话历史</span>
        <button id="history-close" aria-label="关闭对话历史" onclick="toggleHistory()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="session-panel">
    <div id="session-overlay" onclick="toggleSessionPanel()"></div>
    <div id="session-content" role="dialog" aria-modal="true" aria-labelledby="session-title">
      <div id="session-header">
        <span id="session-title">恢复对话</span>
        <button id="session-close" aria-label="关闭会话切换" onclick="toggleSessionPanel()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="session-list"></div>
      <button id="session-new" onclick="startNewSession()">开始全新对话</button>
    </div>
  </div>

  <audio id="tts-audio" preload="auto"></audio>
  <audio id="bgm-audio" loop preload="auto"></audio>

  <div id="confirm-overlay" class="confirm-overlay">
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="confirm-title" id="confirm-title">确认操作</div>
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="confirm-detail" id="confirm-detail"></div>
      <div class="confirm-btns">
        <button id="confirm-cancel" class="confirm-btn-cancel" aria-label="取消">取消</button>
        <button id="confirm-ok" class="confirm-btn-ok" aria-label="确认删除">确认删除</button>
      </div>
    </div>
  </div>

  <div id="app-toast" class="app-toast" role="status"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/",
      "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.8/lib/three-vrm.module.js"
    }
  }
  </script>
  <script src="./app.js"></script>
</body>
</html>
