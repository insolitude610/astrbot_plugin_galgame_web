<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>语音收藏 - AI Galgame 虚拟伙伴</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  background: #000;
  position: relative;
  overflow: hidden;
}

/* background layer (matches history panel overlay) */
#fav-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  background-color: #000;
}
#fav-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(rgba(50, 40, 30, 0.68), rgba(35, 28, 20, 0.65));
}

/* content container (matches history-content card) */
#fav-container {
  position: relative;
  z-index: 1;
  margin: 40px 60px;
  height: calc(100vh - 80px);
  background: rgba(55, 42, 32, 0.92);
  border: 1px solid rgba(200, 160, 120, 0.12);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 48px rgba(0, 0, 0, 0.35), 0 0 60px rgba(180, 130, 80, 0.05);
}

/* header */
#fav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(200, 160, 120, 0.08);
  flex-shrink: 0;
}
#fav-title {
  font-size: 15px;
  font-weight: 600;
  color: rgba(250, 230, 200, 0.88);
}
#fav-sub {
  font-size: 12px;
  color: rgba(200, 160, 120, 0.45);
  margin-left: 10px;
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 1px solid rgba(200, 160, 120, 0.18);
  border-radius: 6px;
  color: rgba(210, 190, 160, 0.55);
  cursor: pointer;
  padding: 4px 10px;
  font-size: 12px;
  text-decoration: none;
  transition: color .2s, border-color .2s;
}
.back-btn:hover { color: rgba(250, 230, 200, 0.9); border-color: rgba(200, 160, 120, 0.35); }

/* scrollable list */
#fav-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}
#fav-list::-webkit-scrollbar { width: 4px; }
#fav-list::-webkit-scrollbar-thumb {
  background: rgba(200, 160, 120, 0.12);
  border-radius: 2px;
}

/* card */
.fav-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(160, 120, 80, 0.10);
  border: 1px solid rgba(200, 160, 120, 0.08);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: background .2s, border-color .2s;
}
.fav-card:hover {
  background: rgba(180, 140, 100, 0.14);
  border-color: rgba(200, 160, 120, 0.18);
}

.fav-date {
  font-size: 11px;
  color: rgba(200, 160, 120, 0.4);
  white-space: nowrap;
  flex-shrink: 0;
}

.fav-text {
  flex: 1;
  font-size: 14px;
  color: rgba(230, 210, 180, 0.85);
  line-height: 1.6;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.btn {
  padding: 6px 14px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: opacity .2s, background .2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn:hover { opacity: 0.88; }
.btn-play { background: rgba(139, 92, 246, 0.35); color: rgba(200, 170, 255, 0.9); }
.btn-play:hover { background: rgba(139, 92, 246, 0.50); }
.btn-delete { background: rgba(180, 120, 110, 0.15); color: rgba(220, 150, 140, 0.7); border: 1px solid rgba(200, 130, 120, 0.15); }
.btn-delete:hover { background: rgba(200, 130, 120, 0.25); color: rgba(230, 160, 150, 0.85); }

.loading { text-align: center; padding: 60px 20px; color: rgba(200, 160, 120, 0.35); font-size: 14px; }
.empty { text-align: center; padding: 80px 20px; color: rgba(200, 160, 120, 0.28); font-size: 14px; }
</style>
</head>
<body>

<div id="fav-bg"></div>
<div id="fav-container">
  <div id="fav-header">
    <div>
      <span id="fav-title">语音收藏</span>
      <span id="fav-sub">不会因 /reset 或 /new 消失</span>
    </div>
    <a class="back-btn" href="./index.html">&larr; 返回</a>
  </div>
  <div id="fav-list"></div>
  <div class="loading" id="loading">加载中...</div>
  <div class="empty" id="empty" style="display:none;">还没有收藏任何语音，对话时点击对话框右侧的 ❤ 按钮即可收藏。</div>
</div>

<script>
var PLUGIN = "astrbot_plugin_galgame_web";
var API_BASE = "/api/plug/" + PLUGIN;
var currentFavAudio = null;
var voiceVolume = 1.0;

async function apiGet(endpoint) {
  var resp = await fetch(API_BASE + "/" + endpoint);
  if (!resp.ok) throw new Error(endpoint + " returned " + resp.status);
  return resp.json();
}

async function apiPost(endpoint, body) {
  var resp = await fetch(API_BASE + "/" + endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw new Error(endpoint + " returned " + resp.status);
  return resp.json();
}

async function loadFavorites() {
  var loading = document.getElementById("loading");
  var list = document.getElementById("fav-list");
  var empty = document.getElementById("empty");
  loading.style.display = "block";
  list.innerHTML = "";
  empty.style.display = "none";

  try {
    var data = await apiGet("favorites/list");
    var favs = data.favorites || [];
    if (!favs.length) {
      empty.style.display = "block";
      loading.style.display = "none";
      return;
    }

    for (var i = 0; i < favs.length; i++) {
      var f = favs[i];
      var d = new Date(f.saved_at * 1000);
      var dateStr = d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0") + " " +
        String(d.getHours()).padStart(2, "0") + ":" +
        String(d.getMinutes()).padStart(2, "0");

      var card = document.createElement("div");
      card.className = "fav-card";
      card.id = "fav-" + f.id;

      var dateEl = document.createElement("span");
      dateEl.className = "fav-date";
      dateEl.textContent = dateStr;
      card.appendChild(dateEl);

      var textEl = document.createElement("div");
      textEl.className = "fav-text";
      textEl.textContent = f.text;
      card.appendChild(textEl);

      var playBtn = document.createElement("button");
      playBtn.className = "btn btn-play";
      playBtn.textContent = "播放";
      playBtn.onclick = (function(file) {
        return function() {
          if (currentFavAudio) { currentFavAudio.pause(); currentFavAudio = null; }
          var inIframe = window.parent !== window;
          if (inIframe) {
            window.parent.postMessage({ kind: "fav-audio-start" }, "*");
          }
          var audio = new Audio("./audio/" + encodeURIComponent(file));
          audio.volume = voiceVolume;
          currentFavAudio = audio;
          function _end() {
            currentFavAudio = null;
            if (inIframe) {
              window.parent.postMessage({ kind: "fav-audio-end" }, "*");
            }
          }
          audio.onended = _end;
          audio.onerror = _end;
          audio.play().catch(function(e) {
            console.warn("Play failed:", e);
            _end();
          });
        };
      })(f.audio_file);
      card.appendChild(playBtn);

      var delBtn = document.createElement("button");
      delBtn.className = "btn btn-delete";
      delBtn.textContent = "取消收藏";
      delBtn.onclick = (function(id) {
        return async function() {
          if (!confirm("确定取消收藏这条语音？")) return;
          try {
            await apiPost("favorites/delete", { id: id });
            document.getElementById("fav-" + id).remove();
            if (!document.querySelector(".fav-card")) {
              empty.style.display = "block";
            }
          } catch(e) {
            alert("删除失败: " + e.message);
          }
        };
      })(f.id);
      card.appendChild(delBtn);

      list.appendChild(card);
    }
  } catch(e) {
    list.innerHTML = '<div class="loading" style="color:rgba(220,150,140,.7);">加载失败: ' + e.message + '</div>';
  }
  loading.style.display = "none";
}

async function loadBackground() {
  try {
    var cfg = await apiGet("config");
    if (cfg.voice_volume != null) { voiceVolume = cfg.voice_volume; }
    if (cfg.background) {
      document.getElementById("fav-bg").style.backgroundImage = "url(./assets/" + encodeURIComponent(cfg.background) + ")";
    }
  } catch(e) {}
}

loadBackground();
loadFavorites();

window.addEventListener("message", function (event) {
  if (event.data && event.data.kind === "stop-audio") {
    if (currentFavAudio) { currentFavAudio.pause(); currentFavAudio = null; }
  }
});

if (window.parent !== window) {
  var backBtns = document.querySelectorAll('.back-btn');
  for (var i = 0; i < backBtns.length; i++) {
    backBtns[i].addEventListener('click', function(e) {
      e.preventDefault();
      window.parent.toggleFavorites();
    });
  }
}
</script>
</body>
</html>
