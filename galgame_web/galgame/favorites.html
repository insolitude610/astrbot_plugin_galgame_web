<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>语音收藏 - AI Galgame 虚拟伙伴</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  min-height: 100vh;
  padding: 24px;
}
h1 { font-size: 22px; margin-bottom: 4px; }
.sub { color: #888; margin-bottom: 20px; font-size: 13px; }
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #aaa;
  text-decoration: none;
  font-size: 13px;
  margin-bottom: 16px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #333;
  transition: color .2s, background .2s;
}
.back-btn:hover { color: #c4b5fd; background: #1e293b; }

.fav-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

.fav-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #0d1b2a;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 12px 16px;
}
.fav-text {
  flex: 1;
  font-size: 14px;
  color: #ccc;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.fav-date {
  font-size: 11px;
  color: #666;
  white-space: nowrap;
  margin-right: 4px;
}

.btn {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: opacity .2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn:hover { opacity: 0.85; }
.btn-play { background: #8b5cf6; color: #fff; }
.btn-delete { background: #ef444466; color: #ef4444; border: 1px solid #ef444433; }
.loading { text-align: center; padding: 40px; color: #888; }
.empty { text-align: center; padding: 60px 20px; color: #555; font-size: 14px; }
</style>
</head>
<body>

<h1>语音收藏 ❤</h1>
<div class="sub">收藏的 AI 语音片段，不会因 /reset 或 /new 消失</div>
<a class="back-btn" href="./index.html">&larr; 返回主界面</a>

<div class="fav-list" id="fav-list"></div>
<div class="loading" id="loading">加载中...</div>
<div class="empty" id="empty" style="display:none;">还没有收藏任何语音，对话时点击对话框右侧的 ❤ 按钮即可收藏。</div>

<script>
var PLUGIN = "astrbot_plugin_galgame_web";
var API_BASE = "/api/plug/" + PLUGIN;

async function apiGet(endpoint) {
  var resp = await fetch(API_BASE + "/" + endpoint);
  if (!resp.ok) throw new Error(endpoint + " returned " + resp.status);
  return resp.json();
}

async function apiPost(endpoint, body) {
  var resp = await fetch(API_BASE + "/" + endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw new Error(endpoint + " returned " + resp.status);
  return resp.json();
}

async function loadFavorites() {
  var loading = document.getElementById("loading");
  var list = document.getElementById("fav-list");
  var empty = document.getElementById("empty");
  loading.style.display = "block";
  list.innerHTML = "";
  empty.style.display = "none";

  try {
    var data = await apiGet("favorites/list");
    var favs = data.favorites || [];
    if (!favs.length) {
      empty.style.display = "block";
      loading.style.display = "none";
      return;
    }

    for (var i = 0; i < favs.length; i++) {
      var f = favs[i];
      var d = new Date(f.saved_at * 1000);
      var dateStr = d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0") + " " +
        String(d.getHours()).padStart(2, "0") + ":" +
        String(d.getMinutes()).padStart(2, "0");

      var card = document.createElement("div");
      card.className = "fav-card";
      card.id = "fav-" + f.id;

      var dateEl = document.createElement("span");
      dateEl.className = "fav-date";
      dateEl.textContent = dateStr;
      card.appendChild(dateEl);

      var textEl = document.createElement("div");
      textEl.className = "fav-text";
      textEl.textContent = f.text;
      card.appendChild(textEl);

      var playBtn = document.createElement("button");
      playBtn.className = "btn btn-play";
      playBtn.textContent = "▶ 播放";
      playBtn.onclick = (function(file) {
        return function() {
          var audio = new Audio("./audio/" + encodeURIComponent(file));
          audio.play().catch(function(e) { console.warn("Play failed:", e); });
        };
      })(f.audio_file);
      card.appendChild(playBtn);

      var delBtn = document.createElement("button");
      delBtn.className = "btn btn-delete";
      delBtn.textContent = "取消收藏";
      delBtn.onclick = (function(id) {
        return async function() {
          if (!confirm("确定取消收藏这条语音？")) return;
          try {
            await apiPost("favorites/delete", { id: id });
            document.getElementById("fav-" + id).remove();
            if (!document.querySelector(".fav-card")) {
              empty.style.display = "block";
            }
          } catch(e) {
            alert("删除失败: " + e.message);
          }
        };
      })(f.id);
      card.appendChild(delBtn);

      list.appendChild(card);
    }
  } catch(e) {
    list.innerHTML = '<div class="loading" style="color:#ef4444;">加载失败: ' + e.message + '</div>';
  }
  loading.style.display = "none";
}

loadFavorites();
</script>
</body>
</html>
