<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>语音收藏 - AI Galgame 虚拟伙伴</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  background: #000;
  position: relative;
  overflow: hidden;
}

/* background layer (matches history panel overlay) */
#fav-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  background-color: #000;
}
#fav-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(rgba(14, 22, 38, 0.72), rgba(12, 18, 32, 0.70));
}

/* content container (matches history-content card) */
#fav-container {
  position: relative;
  z-index: 1;
  margin: 40px 60px;
  height: calc(100vh - 80px);
  background: rgba(20, 30, 48, 0.92);
  border: 1px solid rgba(140, 170, 210, 0.20);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 48px rgba(0, 0, 0, 0.35), 0 0 60px rgba(90, 140, 200, 0.05);
}

/* header */
#fav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(140, 170, 210, 0.12);
  flex-shrink: 0;
}
#fav-title {
  font-size: 15px;
  font-weight: 600;
  color: rgba(219, 231, 245, 0.92);
}
#fav-sub {
  font-size: 12px;
  color: rgba(160, 185, 215, 0.5);
  margin-left: 10px;
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 1px solid rgba(140, 170, 210, 0.30);
  border-radius: 6px;
  color: rgba(160, 185, 215, 0.6);
  cursor: pointer;
  padding: 4px 10px;
  font-size: 12px;
  text-decoration: none;
  transition: color .2s, border-color .2s;
}
.back-btn:hover { color: rgba(180, 210, 240, 0.92); border-color: rgba(160, 185, 215, 0.35); }

/* scrollable list */
#fav-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}
#fav-list::-webkit-scrollbar { width: 4px; }
#fav-list::-webkit-scrollbar-thumb {
  background: rgba(140, 170, 210, 0.22);
  border-radius: 2px;
}

/* card */
.fav-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(140, 170, 210, 0.08);
  border: 1px solid rgba(140, 170, 210, 0.12);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: background .2s, border-color .2s;
}
.fav-card:hover {
  background: rgba(150, 180, 215, 0.12);
  border-color: rgba(140, 170, 210, 0.22);
}

.fav-date {
  font-size: 11px;
  color: rgba(160, 185, 215, 0.45);
  white-space: nowrap;
  flex-shrink: 0;
}

.fav-text {
  flex: 1;
  font-size: 14px;
  color: rgba(219, 231, 245, 0.9);
  line-height: 1.6;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.btn {
  padding: 6px 14px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: opacity .2s, background .2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn:hover { opacity: 0.88; }
.btn-play { background: rgba(91, 140, 196, 0.3); color: rgba(180, 210, 240, 0.92); }
.btn-play:hover { background: rgba(91, 140, 196, 0.45); }
.btn-delete { background: rgba(180, 90, 100, 0.15); color: rgba(230, 150, 160, 0.75); border: 1px solid rgba(200, 110, 120, 0.18); }
.btn-delete:hover { background: rgba(200, 100, 110, 0.25); color: rgba(235, 160, 170, 0.88); }

.loading { text-align: center; padding: 60px 20px; color: rgba(160, 185, 215, 0.4); font-size: 14px; }
.empty { text-align: center; padding: 80px 20px; color: rgba(160, 185, 215, 0.32); font-size: 14px; }
@media (max-width: 640px) {
  html, body { min-height: 100%; height: auto; overflow: auto; }
  #fav-container { margin: 12px; height: calc(100vh - 24px); }
  #fav-header { padding: 12px 14px; }
  #fav-sub { display: block; margin: 3px 0 0; }
  #fav-list { padding: 12px; }
  .fav-card { align-items: flex-start; flex-wrap: wrap; padding: 12px; }
  .fav-text { flex-basis: calc(100% - 90px); }
  .fav-date { order: 3; flex: 1; }
}

/* ---- toast ---- */

.app-toast {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  max-width: 82vw;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13.5px;
  line-height: 1.5;
  background: rgba(20, 30, 48, 0.94);
  border: 1px solid rgba(140, 170, 210, 0.35);
  color: #dbe7f5;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 1300;
  word-break: break-word;
}
.app-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.app-toast.toast-error { border-color: rgba(230, 90, 100, 0.4); color: #ffd9dc; }
.app-toast.toast-success { border-color: rgba(110, 210, 150, 0.4); color: #d4f7e2; }

.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 14, 26, 0.62);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1200;
}
.confirm-overlay.active { display: flex; }
.confirm-card {
  width: min(360px, 86vw);
  background: linear-gradient(160deg, rgba(30, 42, 60, 0.96), rgba(20, 30, 48, 0.96));
  border: 1px solid rgba(140, 170, 210, 0.30);
  border-radius: 10px;
  padding: 22px 20px 18px;
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
  color: #dbe7f5;
  font-size: 14px;
}
.confirm-title {
  font-size: 15px;
  font-weight: 700;
  color: #eaf2fb;
  margin-bottom: 10px;
}
.confirm-msg { line-height: 1.55; word-break: break-word; }
.confirm-btns {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 18px;
}
.confirm-btns button {
  padding: 8px 18px;
  font-size: 14px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.2s;
}
.confirm-btn-cancel {
  background: rgba(255, 255, 255, 0.06);
  color: rgba(190, 212, 238, 0.85);
  border-color: rgba(140, 170, 210, 0.35);
}
.confirm-btn-cancel:hover { background: rgba(255, 255, 255, 0.11); }
.confirm-btn-ok {
  background: rgba(210, 70, 80, 0.28);
  color: #ffd9dc;
  border-color: rgba(230, 90, 100, 0.35);
}
.confirm-btn-ok:hover { background: rgba(210, 70, 80, 0.4); }
.confirm-btn-ok:disabled { opacity: 0.55; cursor: default; }
</style>
</head>
<body>

<div id="fav-bg"></div>
<div id="fav-container">
  <div id="fav-header">
    <div>
      <span id="fav-title">语音收藏</span>
      <span id="fav-sub">不会因 /reset 或 /new 消失</span>
    </div>
    <a class="back-btn" href="./index.html">&larr; 返回</a>
  </div>
  <div id="fav-list"></div>
  <div class="loading" id="loading">加载中...</div>
  <div class="empty" id="empty" style="display:none;">还没有收藏任何语音，对话时点击对话框右侧的 ❤ 按钮即可收藏。</div>
</div>

<div id="app-toast" class="app-toast" role="status"></div>

<div id="confirm-overlay" class="confirm-overlay">
  <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-title" id="confirm-title">确认操作</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-detail" id="confirm-detail"></div>
    <div class="confirm-btns">
      <button id="confirm-cancel" class="confirm-btn-cancel" aria-label="取消">取消</button>
      <button id="confirm-ok" class="confirm-btn-ok" aria-label="确认删除">确认删除</button>
    </div>
  </div>
</div>

<script>
var PLUGIN = "astrbot_plugin_galgame_web";
var API_BASE = "/api/plug/" + PLUGIN;
var currentFavAudio = null;
var voiceVolume = 1.0;

async function apiGet(endpoint) {
  var resp = await fetch(API_BASE + "/" + endpoint);
  if (!resp.ok) throw new Error(endpoint + " returned " + resp.status);
  return resp.json();
}

async function apiPost(endpoint, body) {
  var resp = await fetch(API_BASE + "/" + endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw new Error(endpoint + " returned " + resp.status);
  return resp.json();
}

async function loadFavorites() {
  var loading = document.getElementById("loading");
  var list = document.getElementById("fav-list");
  var empty = document.getElementById("empty");
  loading.style.display = "block";
  list.innerHTML = "";
  empty.style.display = "none";

  try {
    var data = await apiGet("favorites/list");
    var favs = data.favorites || [];
    if (!favs.length) {
      empty.style.display = "block";
      loading.style.display = "none";
      return;
    }

    for (var i = 0; i < favs.length; i++) {
      var f = favs[i];
      var d = new Date(f.saved_at * 1000);
      var dateStr = d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0") + " " +
        String(d.getHours()).padStart(2, "0") + ":" +
        String(d.getMinutes()).padStart(2, "0");

      var card = document.createElement("div");
      card.className = "fav-card";
      card.id = "fav-" + f.id;

      var dateEl = document.createElement("span");
      dateEl.className = "fav-date";
      dateEl.textContent = dateStr;
      card.appendChild(dateEl);

      var textEl = document.createElement("div");
      textEl.className = "fav-text";
      textEl.textContent = f.text;
      card.appendChild(textEl);

      var playBtn = document.createElement("button");
      playBtn.className = "btn btn-play";
      playBtn.textContent = "播放";
      playBtn.onclick = (function(file) {
        return function() {
          if (currentFavAudio) { currentFavAudio.pause(); currentFavAudio = null; }
          var inIframe = window.parent !== window;
          if (inIframe) {
            window.parent.postMessage({ kind: "fav-audio-start" }, "*");
          }
          var audio = new Audio("./audio/" + encodeURIComponent(file));
          audio.volume = voiceVolume;
          currentFavAudio = audio;
          function _end() {
            currentFavAudio = null;
            if (inIframe) {
              window.parent.postMessage({ kind: "fav-audio-end" }, "*");
            }
          }
          audio.onended = _end;
          audio.onerror = _end;
          audio.play().catch(function(e) {
            console.warn("Play failed:", e);
            _end();
          });
        };
      })(f.audio_file);
      card.appendChild(playBtn);

      var delBtn = document.createElement("button");
      delBtn.className = "btn btn-delete";
      delBtn.textContent = "取消收藏";
      delBtn.onclick = (function(id) {
        return function() {
          showConfirm("取消收藏这条语音？", null, function() {
            return apiPost("favorites/delete", { id: id }).then(function() {
              document.getElementById("fav-" + id).remove();
              if (!document.querySelector(".fav-card")) {
                empty.style.display = "block";
              }
            }).catch(function(e) {
              showToast("删除失败: " + e.message, "error");
            });
          });
        };
      })(f.id);
      card.appendChild(delBtn);

      list.appendChild(card);
    }
  } catch(e) {
    list.textContent = "";
    var errorEl = document.createElement("div");
    errorEl.className = "loading";
    errorEl.style.color = "rgba(220,150,140,.7)";
    errorEl.textContent = "加载失败: " + e.message;
    list.appendChild(errorEl);
  }
  loading.style.display = "none";
}

async function loadBackground() {
  try {
    var cfg = await apiGet("config");
    if (cfg.voice_volume != null) { voiceVolume = cfg.voice_volume; }
    if (cfg.background) {
      document.getElementById("fav-bg").style.backgroundImage = "url(./assets/" + encodeURIComponent(cfg.background) + ")";
    }
  } catch(e) {}
}

loadBackground();
loadFavorites();

/* ---- toast ---- */

var _toastTimer = null;

function showToast(msg, type) {
  var el = document.getElementById("app-toast");
  if (!el) return;
  if (_toastTimer) clearTimeout(_toastTimer);
  el.textContent = msg;
  el.className = "app-toast visible " + (type === "error" ? "toast-error" : "toast-success");
  _toastTimer = setTimeout(function() { el.classList.remove("visible"); }, 3000);
}

/* ---- confirm overlay ---- */

var _confirmCb = null;

function showConfirm(message, detail, onConfirm) {
  _confirmCb = onConfirm;
  var msgEl = document.getElementById("confirm-msg");
  var detEl = document.getElementById("confirm-detail");
  var okBtn = document.getElementById("confirm-ok");
  if (msgEl) msgEl.textContent = message;
  if (detEl) {
    detEl.textContent = detail || "";
    detEl.style.display = detail ? "" : "none";
  }
  var ov = document.getElementById("confirm-overlay");
  if (ov) ov.classList.add("active");
  if (okBtn) {
    okBtn.disabled = false;
    setTimeout(function() { okBtn.focus(); }, 50);
  }
}

function closeConfirm() {
  var ov = document.getElementById("confirm-overlay");
  if (ov) ov.classList.remove("active");
  _confirmCb = null;
}

function _confirmOk() {
  var okBtn = document.getElementById("confirm-ok");
  if (okBtn) okBtn.disabled = true;
  var cb = _confirmCb;
  if (typeof cb !== "function") { closeConfirm(); return; }
  Promise.resolve().then(function() { return cb(); }).finally(closeConfirm);
}

(function() {
  var cancelBtn = document.getElementById("confirm-cancel");
  var okBtn = document.getElementById("confirm-ok");
  var ov = document.getElementById("confirm-overlay");
  if (cancelBtn) cancelBtn.addEventListener("click", closeConfirm);
  if (okBtn) okBtn.addEventListener("click", _confirmOk);
  if (ov) ov.addEventListener("click", function(e) { if (e.target === ov) closeConfirm(); });
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" && ov && ov.classList.contains("active")) {
      e.stopPropagation();
      closeConfirm();
    }
  });
})();

window.addEventListener("message", function (event) {
  if (event.data && event.data.kind === "stop-audio") {
    if (currentFavAudio) { currentFavAudio.pause(); currentFavAudio = null; }
  }
});

if (window.parent !== window) {
  var backBtns = document.querySelectorAll('.back-btn');
  for (var i = 0; i < backBtns.length; i++) {
    backBtns[i].addEventListener('click', function(e) {
      e.preventDefault();
      window.parent.toggleFavorites();
    });
  }
}
</script>
</body>
</html>
